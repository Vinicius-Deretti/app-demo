name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-demo:${{ github.sha }}

      - name: Checkout do Repositorio GitOps
        uses: actions/checkout@v4
        with:
          repository: Vinicius-Deretti/gitops-manifests
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-manifests

      - name: Atualizar Imagem no Manifesto Kubernetes
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/app-demo:${{ github.sha }}
        run: |
          cd gitops-manifests
          sed -i -E "s|(^[[:space:]]*image:).*app-demo:.*|\1 ${IMAGE}|" deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update image tag to ${{ github.sha }}"
          git push
